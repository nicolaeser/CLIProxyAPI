# CLIProxyAPI — cluster mode against CLIProxyAPIHome.
# Pulls the published image from GHCR (same image as docker-compose.yml).
#
#   cp .env.cluster.example .env
#   docker compose -f docker-compose.cluster.yml up -d

name: cliproxyapi-cluster

services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-ghcr.io/nicolaeser/cliproxyapi}:${CLI_PROXY_IMAGE_TAG:-latest}
    pull_policy: ${CLI_PROXY_PULL_POLICY:-always}
    container_name: ${CLI_PROXY_CONTAINER_NAME:-cli-proxy-api-cluster}
    environment:
      HOME_JWT: ${HOME_JWT:-}
    ports:
      - "8317:8317"
    volumes:
      - ${CLI_PROXY_HOME_PATH:-./home}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    command: >
      sh -eu -c '
        if [ -z "$$HOME_JWT" ]; then
          echo "HOME_JWT is required" >&2
          exit 1
        fi

        exec ./CLIProxyAPI -home-jwt "$$HOME_JWT"
      '
    restart: unless-stopped
