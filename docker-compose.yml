# CLIProxyAPI — production / release
# Pulls the published image from GHCR.
#
#   cp config.example.yaml config.yaml   # then edit
#   docker compose up -d
#
# Override tag:
#   CLI_PROXY_IMAGE_TAG=v2026.09.17.abcdef0 docker compose up -d
#
# Local source build: docker compose -f docker-compose.dev.yml up --build

name: cliproxyapi

services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-ghcr.io/nicolaeser/cliproxyapi}:${CLI_PROXY_IMAGE_TAG:-latest}
    pull_policy: ${CLI_PROXY_PULL_POLICY:-always}
    container_name: ${CLI_PROXY_CONTAINER_NAME:-cli-proxy-api}
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    restart: unless-stopped
